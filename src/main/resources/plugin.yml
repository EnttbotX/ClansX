main: x.Entt.ClansX.CX
version: 1.3.1
name: ClansX
author: Enttbot
api-version: "1.13"
softdepend: [ Vault , PlaceholderAPI ]

commands:
  clansx:
    description: The main command to config and manage CX. Only for admins!
    aliases: [clx]
  clans:
    description: The command for clans (creating, deleting, etc). For users
    aliases: [cls]

permissions:
  cx.*:
    description: Get all perms of the plugin.
    default: op
    children:
      cx.admin: true
      cx.user.*: true

  cx.admin:
    description: Get access to admin commands.
    default: op

  cx.user.*:
    description: Get access to user commands.
    default: true
    children:
      cx.user.create: true
      cx.user.disband: true
      cx.user.chest: true
      cx.user.invite: true
      cx.user.expel: true
      cx.user.join: true
      cx.user.leave: true
      cx.user.chat: true
      cx.user.home: true
      cx.user.setHome: true
      cx.user.list: true
      cx.user.info: true
      cx.user.war: true
      cx.user.report: true
      cx.user.edit: true
      cx.user.economy: true
      cx.user.stats: true
      cx.user.resign: true
      cx.user.relations: true

  cx.user.create:
    description: Create a clan.
    default: true

  cx.user.relations:
    description: Change the relations of the clan
    default: true

  cx.user.chest:
    description: Use the clan chest.
    default: true

  cx.user.disband:
    description: Disband your clan.
    default: true

  cx.user.invite:
    description: Invite players to your clan.
    default: true

  cx.user.expel:
    description: Expel players from your clan.
    default: true

  cx.user.join:
    description: Join a clan.
    default: true

  cx.user.leave:
    description: Leave your current clan.
    default: true

  cx.user.chat:
    description: Use the clan chat.
    default: true

  cx.user.home:
    description: Teleport to the clan home.
    default: true

  cx.user.setHome:
    description: Set the clan home.
    default: op

  cx.user.list:
    description: List all clans.
    default: true

  cx.user.info:
    description: View clan info.
    default: true

  cx.user.wars:
    description: Manage the clan war system.
    default: true

  cx.user.report:
    description: Report a clan.
    default: true

  cx.user.edit:
    description: Edit clan settings.
    default: true

  cx.user.economy:
    description: Manage clan economy.
    default: true

  cx.user.stats:
    description: View clan statistics.
    default: true

  cx.user.resign:
    description: Resign from clan role.
    default: true